<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="#3b82f6" opacity="0.1"/>
  <circle cx="100" cy="530" r="150" fill="#06b6d4" opacity="0.1"/>
  
  <!-- Logo circle -->
  <circle cx="600" cy="250" r="80" fill="url(#accent)"/>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">O</text>
  
  <!-- Site name -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">olox.in</text>
  
  <!-- Tagline -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">The Developer's Guide to Wealth</text>
  
  <!-- Bottom accent line -->
  <rect x="450" y="520" width="300" height="4" fill="url(#accent)" rx="2"/>
</svg>
