<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <meta http-equiv="refresh" content="0; url={{ .Params.redirect | default "/" }}">
  <link rel="canonical" href="{{ .Params.redirect | default "/" | absURL }}">
</head>
<body>
  <p>Redirecting to <a href="{{ .Params.redirect | default "/" }}">{{ .Params.redirect | default "/" }}</a>...</p>
  <script>window.location.href = "{{ .Params.redirect | default "/" }}";</script>
</body>
</html>
