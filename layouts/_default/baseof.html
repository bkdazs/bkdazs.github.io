<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  
  <!-- SEO Meta -->
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="keywords" content="{{ with .Keywords }}{{ delimit . ", " }}{{ else }}{{ delimit .Site.Params.keywords ", " }}{{ end }}">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  {{ with .Site.Params.images }}<meta property="og:image" content="{{ index . 0 | absURL }}">{{ end }}
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="{{ .Site.Params.twitter }}">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ .Permalink }}">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome 6 Icons -->
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons (fallback) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- AOS - Animate On Scroll -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  
  <!-- Prism.js Syntax Highlighting -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/toolbar/prism-toolbar.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet">
  
  <!-- LightGallery for Image Viewing -->
  <link href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery-bundle.min.css" rel="stylesheet">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Custom Styles -->
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.Permalink }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  
  <!-- Extend Head (SEO, Schema, etc.) -->
  {{ partial "extend_head.html" . }}
  
  <!-- Theme Script -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Header -->
  {{ partial "header.html" . }}
  
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      {{ partial "sidebar.html" . }}
      
      <!-- Main Content -->
      <main class="col-lg-9 col-xl-10 main-content">
        <div class="content-wrapper py-4">
          {{ block "main" . }}{{ end }}
        </div>
      </main>
    </div>
  </div>
  
  <!-- Footer -->
  {{ partial "footer.html" . }}
  
  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- AOS - Animate On Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  
  <!-- Prism.js Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
  
  <!-- LightGallery for Images -->
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/zoom/lg-zoom.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/thumbnail/lg-thumbnail.umd.min.js"></script>
  
  <!-- Fuse.js for Search -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  
  <!-- Custom Scripts -->
  <script>
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      
      // Update icon
      document.querySelectorAll('.theme-toggle .bi-sun-fill, .theme-toggle .bi-moon-fill').forEach(icon => {
        icon.classList.toggle('d-none');
      });
    }
    
    // Initialize on load
    $(document).ready(function() {
      // Theme initialization
      const theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'dark') {
        $('.theme-toggle .bi-sun-fill').addClass('d-none');
        $('.theme-toggle .bi-moon-fill').removeClass('d-none');
      }
      
      // Initialize AOS animations
      AOS.init({
        duration: 600,
        easing: 'ease-out',
        once: true,
        offset: 50
      });
      
      // Initialize LightGallery on article images
      if ($('.prose img').length) {
        lightGallery(document.querySelector('.prose'), {
          selector: 'img',
          plugins: [lgZoom, lgThumbnail],
          speed: 300,
          download: false
        });
      }
      
      // Add line numbers to code blocks
      $('pre code').each(function() {
        $(this).parent().addClass('line-numbers');
      });
      
      // Highlight current nav item
      const path = window.location.pathname;
      $('.sidebar-nav a').each(function() {
        if ($(this).attr('href') === path) {
          $(this).addClass('active');
        }
      });
      
      // ===== SEARCH FUNCTIONALITY =====
      let searchIndex = null;
      let fuse = null;
      let selectedIndex = -1;
      
      // Load search index
      function loadSearchIndex() {
        if (searchIndex) return Promise.resolve();
        return $.getJSON('/index.json').then(function(data) {
          searchIndex = data;
          fuse = new Fuse(searchIndex, {
            keys: [
              { name: 'title', weight: 0.4 },
              { name: 'description', weight: 0.3 },
              { name: 'content', weight: 0.2 },
              { name: 'tags', weight: 0.05 },
              { name: 'categories', weight: 0.05 }
            ],
            threshold: 0.3,
            ignoreLocation: true,
            minMatchCharLength: 2,
            includeScore: true,
            includeMatches: true
          });
        });
      }
      
      // Render search results
      function renderResults(results) {
        const $results = $('#searchResults');
        const $empty = $('#searchEmpty');
        const $noResults = $('#searchNoResults');
        
        $results.empty();
        selectedIndex = -1;
        
        if (!results || results.length === 0) {
          $empty.hide();
          $noResults.show();
          return;
        }
        
        $empty.hide();
        $noResults.hide();
        
        results.slice(0, 10).forEach(function(result, index) {
          const item = result.item;
          const sectionIcon = {
            'docs': 'fa-book',
            'posts': 'fa-newspaper'
          }[item.section] || 'fa-file-alt';
          
          const $item = $(`
            <a href="${item.url}" class="search-result-item list-group-item list-group-item-action d-flex align-items-start gap-3 py-3" data-index="${index}">
              <div class="search-icon text-body-secondary">
                <i class="fa-solid ${sectionIcon}"></i>
              </div>
              <div class="flex-grow-1 min-width-0">
                <div class="d-flex align-items-center gap-2 mb-1">
                  <span class="badge bg-${item.section === 'docs' ? 'primary' : 'secondary'} bg-opacity-10 text-${item.section === 'docs' ? 'primary' : 'secondary'} text-capitalize">${item.section}</span>
                  ${item.categories ? `<span class="text-body-tertiary small">${item.categories}</span>` : ''}
                </div>
                <div class="fw-semibold text-truncate">${item.title}</div>
                <div class="text-body-secondary small text-truncate">${item.description || ''}</div>
              </div>
              <div class="text-body-tertiary small text-nowrap">
                ${item.readingTime} min
              </div>
            </a>
          `);
          $results.append($item);
        });
      }
      
      // Search input handler
      const $searchInput = $('#searchInput');
      const $clearSearch = $('#clearSearch');
      let debounceTimer;
      
      $searchInput.on('input', function() {
        const query = $(this).val().trim();
        
        clearTimeout(debounceTimer);
        
        if (query.length === 0) {
          $('#searchResults').empty();
          $('#searchEmpty').show();
          $('#searchNoResults').hide();
          $clearSearch.hide();
          return;
        }
        
        $clearSearch.show();
        
        debounceTimer = setTimeout(function() {
          loadSearchIndex().then(function() {
            const results = fuse.search(query);
            renderResults(results);
          });
        }, 200);
      });
      
      // Clear search
      $clearSearch.on('click', function() {
        $searchInput.val('').trigger('input').focus();
      });
      
      // Keyboard navigation
      $searchInput.on('keydown', function(e) {
        const $items = $('.search-result-item');
        
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedIndex = Math.min(selectedIndex + 1, $items.length - 1);
          $items.removeClass('active');
          $items.eq(selectedIndex).addClass('active');
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedIndex = Math.max(selectedIndex - 1, 0);
          $items.removeClass('active');
          $items.eq(selectedIndex).addClass('active');
        } else if (e.key === 'Enter' && selectedIndex >= 0) {
          e.preventDefault();
          window.location.href = $items.eq(selectedIndex).attr('href');
        }
      });
      
      // Clear on modal close
      $('#searchModal').on('hidden.bs.modal', function() {
        $searchInput.val('');
        $('#searchResults').empty();
        $('#searchEmpty').show();
        $('#searchNoResults').hide();
        $clearSearch.hide();
        selectedIndex = -1;
      });
    });
  </script>
  
  <!-- Content Protection Script -->
  <script>
  (function() {
    'use strict';
    
    // Disable right-click context menu
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });
    
    // Disable text selection
    document.addEventListener('selectstart', function(e) {
      // Allow selection in input fields and textareas
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        return true;
      }
      e.preventDefault();
      return false;
    });
    
    // Disable copy
    document.addEventListener('copy', function(e) {
      e.preventDefault();
      return false;
    });
    
    // Disable cut
    document.addEventListener('cut', function(e) {
      e.preventDefault();
      return false;
    });
    
    // Disable drag
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      return false;
    });
    
    // Disable keyboard shortcuts for copy/cut/select all/print/save
    document.addEventListener('keydown', function(e) {
      // Ctrl/Cmd + C (Copy)
      if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + X (Cut)
      if ((e.ctrlKey || e.metaKey) && e.key === 'x') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + A (Select All)
      if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + P (Print)
      if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + S (Save)
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + U (View Source)
      if ((e.ctrlKey || e.metaKey) && e.key === 'u') {
        e.preventDefault();
        return false;
      }
      // F12 (Developer Tools)
      if (e.key === 'F12') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + Shift + I (Developer Tools)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + Shift + J (Console)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'J') {
        e.preventDefault();
        return false;
      }
      // Ctrl/Cmd + Shift + C (Inspect Element)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        return false;
      }
    });
    
    // Disable image dragging
    document.querySelectorAll('img').forEach(function(img) {
      img.setAttribute('draggable', 'false');
    });
    
    // Apply to dynamically added images
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.tagName === 'IMG') {
            node.setAttribute('draggable', 'false');
          }
          if (node.querySelectorAll) {
            node.querySelectorAll('img').forEach(function(img) {
              img.setAttribute('draggable', 'false');
            });
          }
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    
    // Console warning message
    console.log('%c⚠️ Content Protected', 'font-size: 24px; color: #dc3545; font-weight: bold;');
    console.log('%cThis website\'s content is protected by copyright. Unauthorized copying or reproduction is prohibited.', 'font-size: 14px; color: #6c757d;');
  })();
  </script>
</body>
</html>
