baseURL: "https://olox.in/"
languageCode: en-us
title: "Olox"
# theme: PaperMod  # Disabled - using custom layouts

# Show only finance content on home/listing pages
mainSections:
  - docs

pagination:
  pagerSize: 10

# Enable useful features
enableRobotsTXT: false  # Using custom static/robots.txt
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# Syntax highlighting for code
pygmentsUseClasses: true
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: github-dark
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

# Minify for production
minify:
  disableXML: true
  minifyOutput: true

# Menu structure - Now data-driven from data/menu.yaml
# Legacy menu kept for compatibility but header uses data/menu.yaml

# URL Aliases / Redirects for posts to docs migration
# Individual page redirects should be added in frontmatter

# Outputs for search functionality
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Taxonomies
taxonomies:
  category: categories
  tag: tags
  series: series

# Site parameters
params:
  env: production
  title: "Olox"
  description: "Personal finance playbook: budgeting, saving, investing, taxes, retirement, and wealth building."
  keywords: [Personal Finance, Investing, Budgeting, Saving, Taxes, Retirement, Stock Market, Debt Management, Insurance, Wealth Management]

  # Limit home/list sections to finance docs
  mainSections:
    - docs
  
  # ============================================
  # SEO & AUTHOR INFO
  # ============================================
  
  # Author information (appears in posts and schema)
  author: "Bijay Krishna"
  
  # Site images for SEO
  images:
    - "/images/site-cover.svg"  # Default OG image (1200x630)
  
  # Social handles (used in templates)
  github: "bkdazs"
  twitter: "@bkdazs"
  linkedin: "krishx"
  
  # Schema.org structured data
  schema:
    publisherType: "Person"  # or "Organization"
    sameAs:
      - "https://github.com/bkdazs"
      - "https://linkedin.com/in/krishx"
      - "https://twitter.com/bkdazs"
  
  # Google Analytics ID
  googleAnalyticsID: "G-GN1WQW6VP3"

  # ============================================
  # AdSense Configuration
  # ============================================
  adsense:
    enabled: true
    client: "pub-3351614345089974"  # Replace with your Publisher ID
    article_slot: "1234567890"         # Replace with your In-article ad slot ID
    sidebar_slot: "0987654321"         # Replace with your Sidebar ad slot ID

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
    useSessionStorage: false
  x:
    enableDNT: true
  youtube:
    privacyEnhanced: true
