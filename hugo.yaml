baseURL: "https://olox.in/"
languageCode: en-us
title: "Olox"
# theme: PaperMod  # Disabled - using custom layouts

pagination:
  pagerSize: 10

# Enable useful features
enableRobotsTXT: false  # Using custom static/robots.txt
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# Syntax highlighting for code
pygmentsUseClasses: true
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: github-dark
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

# Minify for production
minify:
  disableXML: true
  minifyOutput: true

# Menu structure
menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: Docs
      url: /docs/
      weight: 2
    - name: Blog
      url: /posts/
      weight: 3
    - name: About
      url: /about/
      weight: 4

# Outputs for search functionality
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Taxonomies
taxonomies:
  category: categories
  tag: tags
  series: series

# Site parameters
params:
  env: production
  title: "Olox"
  description: "The Developer's Guide to Wealth — Insights on AI, Investing, Programming, and the Future of Money"
  keywords: [Olox, Technology, Finance, AI, Machine Learning, Investing, Programming, Fintech, Crypto, Trading]
  
  # ============================================
  # SEO & AUTHOR INFO
  # ============================================
  
  # Author information (appears in posts and schema)
  author: "Bijay Krishna"
  
  # Site images for SEO
  images:
    - "/images/site-cover.svg"  # Default OG image (1200x630)
  
  # Social handles (used in templates)
  github: "bkdazs"
  twitter: "@bkdazs"
  linkedin: "krishx"
  
  # Schema.org structured data
  schema:
    publisherType: "Person"  # or "Organization"
    sameAs:
      - "https://github.com/bkdazs"
      - "https://linkedin.com/in/krishx"
      - "https://twitter.com/bkdazs"
  
  # Google Analytics ID
  googleAnalyticsID: "G-GN1WQW6VP3"

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
    useSessionStorage: false
  x:
    enableDNT: true
  youtube:
    privacyEnhanced: true
